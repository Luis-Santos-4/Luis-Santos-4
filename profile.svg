    </rect>
    <text x="36" y="331" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> git push --force <tspan>█<animate attributeName="fill-opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
