    <text x="36" y="216" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> ./workout --mode=beast</text>
    <text x="36" y="239" fill="#8b949e">&gt; Bench press</text>
    <text x="260" y="239" fill="#e6edf3">3x10</text>
    <text x="336" y="239" fill="#3fb950">✔</text>
