  <text x="210" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Code. <tspan fill="#58a6ff">Lift.</tspan> Repeat.</text>
  <rect x="20" y="192" width="380" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
